name: VAU Discord
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: vau-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save scan history
        if: always()
        run: |
          if [ -f .vau-state/su-kien-v2.json ]; then
            git add .vau-state/su-kien-v2.json
            if ! git diff --cached --quiet; then
              git config user.name github-actions
              git config user.email actions@users.noreply.github.com
              git commit -m "Update VAU event history"
              git push
            fi
          fi
